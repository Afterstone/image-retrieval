[project]
name = "image-retrieval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "afterstone", email = "invisiblex@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "evoc>=0.3.1",
    "marimo>=0.23.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "PyYAML>=6.0.3",
    "sentence-transformers[image]>=6.1.0,<7",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "polars>=1.40.1",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.20.2,<6",
    "wigglystuff>=0.3.5",
]

[project.scripts]
image-retrieval = "image_retrieval.main:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14", "ty>=0.0.1"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
